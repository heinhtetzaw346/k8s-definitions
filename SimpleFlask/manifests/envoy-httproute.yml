apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: simple-flask-route
spec:
  parentRefs:
    - name: simple-flask-gw
      namespace: envoy-gateway-system
      sectionName: http
    - name: simple-flask-gw
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "simple-flask.lab.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: simple-flask
          port: 5080
