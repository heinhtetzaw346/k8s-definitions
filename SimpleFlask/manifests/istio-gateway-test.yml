apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: simple-flask-gw-test
  namespace: istio-system
spec:
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: gateway-params
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "simple-flask-test.lab.local"
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: HTTPRoute 
