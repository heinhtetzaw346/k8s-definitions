apiVersion: apps/v1
kind: Deployment
metadata:
  name: psql-client
  labels:
    app: psql-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: psql-client
  template:
    metadata:
      labels:
        app: psql-client
    spec:
      containers:
      - name: psql-client
        image: postgres:alpine
        command:
        - sleep
        - "infinity"
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
