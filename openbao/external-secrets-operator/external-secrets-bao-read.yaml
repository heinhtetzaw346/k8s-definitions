apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-bao-read
  namespace: vault-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-bao-read-role
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-bao-read-binding
subjects:
- kind: ServiceAccount
  name: external-secrets-bao-read
  namespace: vault-system
roleRef:
  kind: ClusterRole
  name: secrets-admin-role
  apiGroup: rbac.authorization.k8s.io
