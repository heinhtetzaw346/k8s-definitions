apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: openbao-ui-passthrough
  namespace: vault-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: openbao-gateway
    namespace: istio-system
    sectionName: https
  hostnames:
  - "vault.lab.local"
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: openbao-active
      port: 8200
      weight: 1
